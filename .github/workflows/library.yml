name: library

# A pull request that adds a font holds sources only. This checks them, and draws a proof for the
# reviewer. After the merge a maintainer starts the build by hand ("Run workflow"): it builds the font
# files and commits them, and the site picks them up. The build runs the entries' font.py with a token
# that can write, so it never starts by itself.

on:
  pull_request:
    paths: ["library/**"]
  workflow_dispatch:

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      # An entry is code from a stranger. This job has no secrets and a read-only token.
      - name: Check the entries that this pull request touches
        run: whateverfont library check --since "$BASE" --author "$AUTHOR" --sources-only
      - name: Draw a proof of each for the reviewer
        run: |
          for name in $(whateverfont library changed --since "$BASE"); do
            whateverfont look "library/$name" --directions --name "$name" --out proofs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: proofs
          path: proofs
          if-no-files-found: ignore

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: whateverfont library build
      - name: Commit the built fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          git diff --cached --quiet || (git commit -m "Build the library fonts" && git push)
