name: release

# Push a tag such as v0.1.0 to publish that version to PyPI. No token is stored here: PyPI trusts
# this workflow by name. Set that up once at https://pypi.org/manage/account/publishing/ with
# project "whateverfont", owner "brianlzhou", repository "whateverfont", workflow "release.yml"
# and environment "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: The tag must match the version of the package
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - uses: pypa/gh-action-pypi-publish@release/v1
